<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reji · İlkkan Sports</title>
  <meta name="theme-color" content="#0a0b16" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%230b0c18'/%3E%3Cg fill='none' stroke='%237ee2b8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13.6 11.5h12.8c-.4 4-2.8 6.1-3 9.5-.2 3 2.2 4.6 2.2 7.4H14.4c0-2.8 2.4-4.4 2.2-7.4-.2-3.4-2.6-5.5-3-9.5z'/%3E%3Cpath d='M10.5 31h19'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="panel.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body class="panel-body">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-crest" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.6" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="1.2"/><g fill="none" stroke="#7ee2b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 11.5h12.8c-.4 4-2.8 6.1-3 9.5-.2 3 2.2 4.6 2.2 7.4H14.4c0-2.8 2.4-4.4 2.2-7.4-.2-3.4-2.6-5.5-3-9.5z"/><path d="M14.5 15h11M10.6 31h18.8M18 8.6c-.7-.9.7-1.6 0-2.6M22 8.6c-.7-.9.7-1.6 0-2.6"/></g></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </svg>

  <!-- Giriş -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="loginForm" novalidate>
      <div class="login__top">
        <svg class="login__crest" aria-hidden="true"><use href="#i-crest" /></svg>
        <div class="lang-toggle" role="group" data-i18n-attr="aria-label:lang.label">
          <button type="button" data-lang="tr" aria-pressed="true">TR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <p class="login__kicker">İlkkan Sports</p>
      <h1 class="login__title" data-i18n-html="login.title">Reji <em>odası</em></h1>
      <p class="login__lede" data-i18n="login.lede">Skorlar, kanallar, reklamlar. Hepsi burada. İlkkan kapıda, sakin sakin bekliyor.</p>
      <label class="field">
        <span class="field__label" data-i18n="login.username">Kullanıcı adı</span>
        <input class="input" name="username" autocomplete="username" required maxlength="40" />
      </label>
      <label class="field">
        <span class="field__label" data-i18n="login.password">Şifre</span>
        <input class="input" name="password" type="password" autocomplete="current-password" required maxlength="200" />
      </label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--ticket login__submit" type="submit" data-i18n="login.submit">Giriş yap</button>
      <a class="login__back" href="/" data-site-link data-i18n="login.back">← Siteye dön</a>
    </form>
  </main>

  <!-- Panel -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#ozet" data-i18n-attr="aria-label:top.home">
        <svg class="brand__crest" aria-hidden="true"><use href="#i-crest" /></svg>
        <span class="brand__lockup"><span class="brand__name">İlkkan</span><span class="brand__sports" data-i18n="top.brand">Reji</span></span>
      </a>
      <p class="onair" id="onair"><i class="pulse" aria-hidden="true"></i><span data-i18n="top.onair">Yayında</span> <b id="onairCount">0</b> <span data-i18n="top.matches">maç</span></p>
      <div class="topbar__right">
        <time class="topbar__clock" id="clock">--:--:--</time>
        <div class="lang-toggle" role="group" data-i18n-attr="aria-label:lang.label">
          <button type="button" data-lang="tr" aria-pressed="true">TR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="chip-link" href="/" data-site-link target="_blank" rel="noopener" data-i18n-attr="aria-label:top.openSiteLabel"><span class="chip-link__text" data-i18n="top.openSite">Siteyi aç</span><svg aria-hidden="true"><use href="#i-ext" /></svg></a>
        <span class="topbar__user" id="whoami"></span>
        <button class="chip-link" id="logoutBtn" type="button" data-i18n="top.logout">Çıkış</button>
      </div>
    </header>

    <nav class="side" data-i18n-attr="aria-label:nav.label">
      <a class="side__link" href="#ozet" data-view="ozet"><span class="side__no">01</span><span data-i18n="nav.ozet">Özet</span></a>
      <a class="side__link" href="#maclar" data-view="maclar"><span class="side__no">02</span><span data-i18n="nav.maclar">Maçlar</span></a>
      <a class="side__link" href="#kanallar" data-view="kanallar"><span class="side__no">03</span><span data-i18n="nav.kanallar">Kanallar</span></a>
      <a class="side__link" href="#reklam" data-view="reklam"><span class="side__no">04</span><span data-i18n="nav.reklam">Reklam alanları</span></a>
      <a class="side__link" href="#metinler" data-view="metinler"><span class="side__no">05</span><span data-i18n="nav.metinler">Metinler</span></a>
      <a class="side__link" href="#ayarlar" data-view="ayarlar"><span class="side__no">06</span><span data-i18n="nav.ayarlar">Ayarlar</span></a>
      <a class="side__link" href="#hesap" data-view="hesap"><span class="side__no">07</span><span data-i18n="nav.hesap">Hesap</span></a>
    </nav>

    <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modalTitle">
    <form class="modal__form" id="modalForm" method="dialog" novalidate>
      <header class="modal__head">
        <h2 class="modal__title" id="modalTitle"></h2>
        <button class="modal__x" type="button" data-close data-i18n-attr="aria-label:common.close">×</button>
      </header>
      <div class="modal__body" id="modalBody"></div>
      <p class="form-error" id="modalError" role="alert" hidden></p>
      <footer class="modal__foot">
        <button class="btn-plain" type="button" data-close data-i18n="common.cancel">Vazgeç</button>
        <button class="btn btn--ticket btn--sm" type="submit" id="modalSubmit">Kaydet</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Panel için JavaScript gerekli. · The control room needs JavaScript.</p></noscript>
</body>
</html>
